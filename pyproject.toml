[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unlinked"
version = "0.1.0"
description = "Say which of your submodule declarations git never acts on: gitlinks that map to nothing, .gitmodules entries nothing ever clones, and the URL your clone still fetches from."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["git", "submodule", "gitmodules", "config", "lint", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5"]

[project.scripts]
unlinked = "unlinked.cli:main"

[project.urls]
Source = "https://github.com/committed-nightly/unlinked"

[tool.hatch.build.targets.wheel]
packages = ["src/unlinked"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No -q. logbook#52: a -q here plus a -q on the command line is -qq, which
# drops the pass count, and then nobody can tell a run of 90 tests from a
# run of none.
addopts = ""
markers = ["git: builds real repositories and asks git what it does"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pyflakes only, matching the rest of the org (logbook#36): the rules about
# code that cannot be right.
select = ["F"]
